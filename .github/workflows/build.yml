name: Build G2012 Wireless Print APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils curl zip make autoconf automake libtool pkg-config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download & Extract Gutenprint 5.3.4
        run: |
          curl -L -o gutenprint.tar.xz https://downloads.sourceforge.net/gimp-print/gutenprint-5.3.4.tar.xz
          tar -xf gutenprint.tar.xz
          mv gutenprint-5.3.4 gutenprint-src

      - name: Package Gutenprint XML Data
        run: |
          mkdir -p app/src/main/assets
          cd gutenprint-src/src/xml
          zip -r ../../../app/src/main/assets/gutenprint_xml.zip . -i "*.xml"

      - name: Cross-Compile Gutenprint & JNI for Android (arm64-v8a & armeabi-v7a)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK" ]; then
            NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -n 1)
          fi
          echo "Using NDK: $NDK"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          build_abi() {
            ABI="$1"
            HOST="$2"
            CLANG_PREFIX="$3"

            echo "=== Building for $ABI ==="
            rm -rf "build-$ABI"
            cp -a gutenprint-src "build-$ABI"
            cd "build-$ABI"

            export CC="$TOOLCHAIN/${CLANG_PREFIX}24-clang"
            export CXX="$TOOLCHAIN/${CLANG_PREFIX}24-clang++"
            export AR="$TOOLCHAIN/llvm-ar"
            export RANLIB="$TOOLCHAIN/llvm-ranlib"
            export STRIP="$TOOLCHAIN/llvm-strip"
            export CFLAGS="-fPIC -O2 -DANDROID"
            export LDFLAGS="-lm"

            ac_cv_func_nl_langinfo=no \
            ac_cv_header_langinfo_h=no \
            ac_cv_func_malloc_0_nonnull=yes \
            ac_cv_func_realloc_0_nonnull=yes \
            ./configure \
              --host="$HOST" \
              --disable-nls \
              --without-cups \
              --without-gimp2 \
              --without-foomatic \
              --without-readline \
              --disable-test \
              --disable-samples \
              --disable-static-genppd \
              --enable-static \
              --disable-shared \
              --with-modules=static \
              --prefix=/usr

            make -C src/main -j$(nproc) libgutenprint.la

            mkdir -p "../app/src/main/jniLibs/$ABI"
            "$CC" -shared -fPIC -O2 \
              -Iinclude \
              -Isrc/main \
              ../app/src/main/cpp/g2012_jni.c \
              src/main/.libs/libgutenprint.a \
              -llog -lm -lz \
              -o "../app/src/main/jniLibs/$ABI/libg2012driver.so"

            "$STRIP" --strip-unneeded "../app/src/main/jniLibs/$ABI/libg2012driver.so"
            cd ..
          }

          build_abi "arm64-v8a" "aarch64-linux-android" "aarch64-linux-android"
          build_abi "armeabi-v7a" "arm-linux-androideabi" "armv7a-linux-androideabi"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: G2012-Wireless-Print-APK
          path: app/build/outputs/apk/debug/app-debug.apk
